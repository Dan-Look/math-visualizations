<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Epsilon–Delta Explorer</title>
<style>
  :root{--bg:#f6f7fb;--panel:#fff;--ink:#0f172a;--muted:#5b6474;--line:#e3e7ef;
        --eps:#c2410c;--del:#1d4ed8;--good:#15803d;--bad:#dc2626;--acc:#7c3aed}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4}
  header{padding:18px 24px 0}
  h1{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.01em}
  .def{font-size:18px;color:#334155}
  .wrap{display:flex;gap:20px;padding:16px 24px 24px;align-items:flex-start}
  .viz{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
       border-radius:14px;padding:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  canvas{display:block;width:100%}
  .panel{flex:0 0 340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:14px 18px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
  .panel h2:first-child{margin-top:2px}
  select{width:100%;font-size:16px;padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
  .ctl{margin:12px 0}
  .ctl .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .ctl .name{font-weight:600;display:flex;align-items:center;gap:8px}
  .swc{width:18px;height:18px;margin:0;cursor:pointer}
  label.name{cursor:pointer}
  input[type=number]{width:100px;font-size:16px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:8px;
                     text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--ink)}
  #epsRng{accent-color:var(--eps)} #delRng{accent-color:var(--del)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  button{font-size:15px;padding:7px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;
         color:var(--ink);cursor:pointer}
  button:hover{background:#eef2f7} button:disabled{opacity:.45;cursor:default}
  .tog{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:16px;cursor:pointer}
  .tog input{width:18px;height:18px;margin:0}
  .status{margin-top:14px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
  .big{font-weight:700;font-size:18px}
  .ok{color:var(--good)} .no{color:var(--bad)}
  .small{font-size:15px;color:#334155;margin-top:4px}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  @media (max-width:980px){.wrap{flex-direction:column}.panel{flex-basis:auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Epsilon–Delta Explorer</h1>
  <div class="def">lim<sub>x→a</sub> f(x) = L &nbsp;means: for every ε &gt; 0 there is a δ &gt; 0 such that
    0 &lt; |x − a| &lt; δ implies |f(x) − L| &lt; ε.</div>
</header>

<div class="wrap">
  <div class="viz"><canvas id="cv"></canvas></div>

  <aside class="panel">
    <h2>Function</h2>
    <select id="fsel"></select>

    <h2>Parameters</h2>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tL" style="accent-color:#0f172a">Proposed limit L</label>
        <input type="number" id="Lnum" step="any"></div>
      <input type="range" id="Lrng">
    </div>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tEps" style="accent-color:var(--eps)">ε</label>
        <input type="number" id="epsNum" step="any" min="0"></div>
      <input type="range" id="epsRng">
    </div>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tDel" style="accent-color:var(--del)">δ</label>
        <input type="number" id="delNum" step="any" min="0"></div>
      <input type="range" id="delRng">
    </div>
    <div class="btns">
      <button id="bestBtn">Set δ to largest (numerical)</button>
      <button id="resetBtn">Reset</button>
    </div>

    <h2>Show</h2>
    <label class="tog"><input type="checkbox" id="tGraph"> Graph of f</label>
    <label class="tog"><input type="checkbox" id="tColor"> Color the graph inside the δ-window</label>
    <label class="tog"><input type="checkbox" id="tCE"> Counterexample point</label>
    <label class="tog"><input type="checkbox" id="tMax"> Largest working δ (dashed)</label>

    <div class="status" id="status"></div>
    <div class="note">Checks use finitely many sample points. They are numerical evidence, not a proof.</div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- Function library ----------
   win: fixed viewing window; eps/del: [default, slider max]; holes/pts: [x,y]
   breaks: x-values where the graph should not be connected. */
const FUNCS = [
  {label:"f(x) = x²,  a = 1", f:x=>x*x, a:1, L:1,
   win:{x0:-0.5,x1:2.5,y0:-1,y1:4}, eps:[0.75,2], del:[0.25,1.5], holes:[], pts:[], breaks:[], n:2000},
  {label:"f(x) = 2x + 1,  a = 1", f:x=>2*x+1, a:1, L:3,
   win:{x0:-1,x1:3,y0:-1,y1:7}, eps:[1,3], del:[0.4,2], holes:[], pts:[], breaks:[], n:2000},
  {label:"f(x) = √x,  a = 4", f:x=>x>=0?Math.sqrt(x):NaN, a:4, L:2,
   win:{x0:-1,x1:9,y0:-1,y1:4}, eps:[0.5,2], del:[1.5,4], holes:[], pts:[], breaks:[], n:3000},
  {label:"f(x) = x² for x ≠ 1, f(1) = 3,  a = 1", f:x=>x===1?3:x*x, a:1, L:1,
   win:{x0:-0.5,x1:2.5,y0:-1,y1:4}, eps:[0.75,2], del:[0.25,1.5], holes:[[1,1]], pts:[[1,3]], breaks:[], n:2000},
  {label:"f(x) = sin(x)/x,  a = 0", f:x=>x===0?NaN:Math.sin(x)/x, a:0, L:1,
   win:{x0:-8,x1:8,y0:-0.5,y1:1.5}, eps:[0.25,1], del:[1,6], holes:[[0,1]], pts:[], breaks:[], n:3000},
  {label:"f(x) = x·sin(1/x),  a = 0", f:x=>x===0?NaN:x*Math.sin(1/x), a:0, L:0,
   win:{x0:-0.5,x1:0.5,y0:-0.5,y1:0.5}, eps:[0.2,0.5], del:[0.15,0.5], holes:[[0,0]], pts:[], breaks:[], n:40000},
  {label:"f(x) = x/2 (x ≤ 0), x/2 + 1 (x > 0),  a = 0", f:x=>x>0?x/2+1:x/2, a:0, L:null, Ldef:0.5,
   win:{x0:-2,x1:2,y0:-1.5,y1:2.5}, eps:[0.75,2], del:[0.4,2], holes:[[0,1]], pts:[[0,0]], breaks:[0], n:2000},
  {label:"f(x) = sin(1/x),  a = 0", f:x=>x===0?NaN:Math.sin(1/x), a:0, L:null, Ldef:0,
   win:{x0:-0.5,x1:0.5,y0:-1.5,y1:1.5}, eps:[0.5,1.5], del:[0.1,0.5], holes:[], pts:[], breaks:[], n:60000},
];

const S = {F:null, L:0, eps:0, del:0};

/* ---------- Numerical checking ---------- */
// Distances from a at which f is sampled: uniform plus log-spaced (to probe very close to a).
function sampleDistances(W){
  const d = [];
  const NU = 6000, NL = 1600;
  for (let i=1;i<=NU;i++) d.push(W*i/NU);
  for (let k=0;k<NL;k++) d.push(W*Math.pow(10, -8 + 8*k/NL));
  d.sort((p,q)=>p-q);
  return d;
}
// Closest sampled x (to a) with |f(x) - L| >= eps, or null.
function firstFail(F, L, eps){
  for (const d of F.d){
    for (const x of [F.a-d, F.a+d]){
      const v = F.f(x);
      if (!isFinite(v)) continue;          // outside the domain
      if (Math.abs(v-L) >= eps) return {d, x, v};
    }
  }
  return null;
}

// Sampled x in the δ-window where |f(x) - L| is largest (used as the displayed counterexample).
function worstIn(F, L, del){
  let best = null;
  for (const d of F.d){
    if (d >= del) break;
    for (const x of [F.a-d, F.a+d]){
      const v = F.f(x);
      if (!isFinite(v)) continue;
      const e = Math.abs(v-L);
      if (!best || e > best.e) best = {x, v, e};
    }
  }
  return best;
}

/* ---------- Formatting ---------- */
const minus = s => s.replace(/-/g, "−");
function fmt(v, sig=4){
  if (!isFinite(v)) return "—";
  if (v === 0) return "0";
  if (Math.abs(v) < 1e-4) return minus(v.toExponential(2));
  return minus(String(Number(v.toPrecision(sig))));
}
const fmtIn = v => String(Number(v.toPrecision(6)));
function niceStep(range, target){
  const raw = range/target, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;
}
function fmtTick(v, step){
  const dec = Math.max(0, -Math.floor(Math.log10(step)+1e-9));
  let s = v.toFixed(dec);
  if (Number(s) === 0) s = (0).toFixed(dec);
  return minus(s);
}

/* ---------- Drawing helpers ---------- */
const cv = $("cv");
const M = {l:64, r:80, t:44, b:46};
function frame(){
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const w = S.F.win, PL=M.l, PR=W-M.r, PT=M.t, PB=H-M.b;
  return {ctx, W, H, PL, PR, PT, PB,
    X: x => PL + (x-w.x0)/(w.x1-w.x0)*(PR-PL),
    Y: y => PB - (y-w.y0)/(w.y1-w.y0)*(PB-PT)};
}
function drawGrid(fr){
  const {ctx,PL,PR,PT,PB,X,Y} = fr, w = S.F.win;
  const sx = niceStep(w.x1-w.x0, 8), sy = niceStep(w.y1-w.y0, 7);
  ctx.font = "15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  ctx.fillStyle = "#475569"; ctx.strokeStyle = "#eef1f6"; ctx.lineWidth = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let x = Math.ceil(w.x0/sx-1e-9)*sx; x <= w.x1+1e-9; x += sx){
    const px = X(x); ctx.beginPath(); ctx.moveTo(px,PT); ctx.lineTo(px,PB); ctx.stroke();
    ctx.fillText(fmtTick(x,sx), px, PB+8);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let y = Math.ceil(w.y0/sy-1e-9)*sy; y <= w.y1+1e-9; y += sy){
    const py = Y(y); ctx.beginPath(); ctx.moveTo(PL,py); ctx.lineTo(PR,py); ctx.stroke();
    ctx.fillText(fmtTick(y,sy), PL-8, py);
  }
  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.2;
  if (w.y0<0 && w.y1>0){ ctx.beginPath(); ctx.moveTo(PL,Y(0)); ctx.lineTo(PR,Y(0)); ctx.stroke(); }
  if (w.x0<0 && w.x1>0){ ctx.beginPath(); ctx.moveTo(X(0),PT); ctx.lineTo(X(0),PB); ctx.stroke(); }
  ctx.strokeStyle = "#cbd5e1"; ctx.strokeRect(PL,PT,PR-PL,PB-PT);
}
function dashedV(ctx,x,y0,y1,color,w=1.5,dash=[6,5]){
  ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x,y0); ctx.lineTo(x,y1); ctx.stroke(); ctx.restore();
}
function dashedH(ctx,y,x0,x1,color,w=1.5,dash=[6,5]){
  ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke(); ctx.restore();
}
function circle(ctx,x,y,r,fill,stroke,lw=2){
  ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI);
  if (fill){ ctx.fillStyle=fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
}
// Labels for a−δ, a, a+δ in the top margin, and L−ε, L, L+ε in the right margin.
function marginLabels(fr, showE, showD, showL){
  const {ctx,PL,PR,PT,PB,X,Y} = fr, F = S.F;
  ctx.font = "600 16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  const xa = X(F.a), xl = X(F.a-S.del), xr = X(F.a+S.del), ty = PT-10;
  ctx.fillStyle = getCss("--del");
  const inX = px => px >= PL-4 && px <= PR+4;
  if (!showD) {}
  else if (xa - xl >= 46){
    if (inX(xl)) ctx.fillText("a − δ", xl, ty);
    ctx.fillText("a", xa, ty);
    if (inX(xr)) ctx.fillText("a + δ", xr, ty);
  } else ctx.fillText("a ± δ", xa, ty);

  ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = getCss("--eps");
  const yL = Y(S.L), yt = Y(S.L+S.eps), yb = Y(S.L-S.eps), lx = PR+10;
  const inY = py => py >= PT-4 && py <= PB+4;
  if (!showE){ if (showL && inY(yL)) ctx.fillText("L", lx, yL); }
  else if (yb - yL >= 22){
    if (inY(yt)) ctx.fillText("L + ε", lx, yt);
    if (inY(yL)) ctx.fillText("L", lx, yL);
    if (inY(yb)) ctx.fillText("L − ε", lx, yb);
  } else if (inY(yL)) ctx.fillText("L ± ε", lx, yL);
}
const cssCache = {};
function getCss(v){ return cssCache[v] || (cssCache[v] = getComputedStyle(document.documentElement).getPropertyValue(v).trim()); }

/* ---------- Main draw ---------- */
function draw(){
  const F = S.F, fr = frame(), {ctx,W,H,PL,PR,PT,PB,X,Y} = fr;
  ctx.clearRect(0,0,W,H);
  drawGrid(fr);

  const fail = firstFail(F, S.L, S.eps);
  const works = !fail || fail.d >= S.del;
  const dMax = fail ? fail.d : F.del[1];
  const ce = works ? null : (worstIn(F, S.L, S.del) || fail);

  ctx.save(); ctx.beginPath(); ctx.rect(PL,PT,PR-PL,PB-PT); ctx.clip();

  const showL = $("tL").checked, showG = $("tGraph").checked, showE = $("tEps").checked, showD = $("tDel").checked;
  // ε-band and δ-window
  if (showE){
    ctx.fillStyle = "rgba(194,65,12,0.12)";
    ctx.fillRect(PL, Y(S.L+S.eps), PR-PL, Y(S.L-S.eps)-Y(S.L+S.eps));
  }
  if (showD){
    ctx.fillStyle = "rgba(29,78,216,0.10)";
    ctx.fillRect(X(F.a-S.del), PT, X(F.a+S.del)-X(F.a-S.del), PB-PT);
  }
  if (showE && showD){
    ctx.strokeStyle = works ? "rgba(21,128,61,0.9)" : "rgba(220,38,38,0.9)"; ctx.lineWidth = 2;
    ctx.strokeRect(X(F.a-S.del), Y(S.L+S.eps), X(F.a+S.del)-X(F.a-S.del), Y(S.L-S.eps)-Y(S.L+S.eps));
  }

  // reference lines x = a, y = L, and band edges
  if (showD) dashedV(ctx, X(F.a), PT, PB, "rgba(29,78,216,0.7)");
  if (showL || showE) dashedH(ctx, Y(S.L), PL, PR, "rgba(194,65,12,0.75)");
  ctx.lineWidth=1;
  if (showE){ ctx.strokeStyle="rgba(194,65,12,0.45)";
    [S.L+S.eps, S.L-S.eps].forEach(y=>{ctx.beginPath();ctx.moveTo(PL,Y(y));ctx.lineTo(PR,Y(y));ctx.stroke();}); }
  if (showD){ ctx.strokeStyle="rgba(29,78,216,0.4)";
    [F.a-S.del, F.a+S.del].forEach(x=>{ctx.beginPath();ctx.moveTo(X(x),PT);ctx.lineTo(X(x),PB);ctx.stroke();}); }

  if ($("tMax").checked && dMax > F.d[0]){
    dashedV(ctx, X(F.a-dMax), PT, PB, getCss("--acc"), 2, [3,4]);
    dashedV(ctx, X(F.a+dMax), PT, PB, getCss("--acc"), 2, [3,4]);
  }

  // graph of f
  if (showG){
  const colorize = $("tColor").checked;
  const base = new Path2D(), good = new Path2D(), bad = new Path2D();
  const n = F.n, w = F.win;
  let px = null, py = null;
  for (let i=0;i<=n;i++){
    const x = w.x0 + (w.x1-w.x0)*i/n;
    const y = Math.abs(x-F.a) < 1e-12 ? NaN : F.f(x);
    if (!isFinite(y)){ px = null; continue; }
    if (px !== null && !F.breaks.some(b => px < b && x >= b)){
      let path = base;
      if (colorize && Math.abs(px-F.a) < S.del && Math.abs(x-F.a) < S.del)
        path = (Math.abs(py-S.L) < S.eps && Math.abs(y-S.L) < S.eps) ? good : bad;
      path.moveTo(X(px),Y(py)); path.lineTo(X(x),Y(y));
    }
    px = x; py = y;
  }
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = "#334155"; ctx.lineWidth = 2.2; ctx.stroke(base);
  ctx.lineWidth = 3.6; ctx.strokeStyle = getCss("--good"); ctx.stroke(good);
  ctx.strokeStyle = getCss("--bad"); ctx.stroke(bad);

  F.holes.forEach(([hx,hy]) => circle(ctx, X(hx), Y(hy), 5.5, "#fff", "#334155", 2));
  F.pts.forEach(([qx,qy]) => circle(ctx, X(qx), Y(qy), 5.5, "#334155", null));
  }

  // counterexample
  if (!works && $("tCE").checked){
    dashedV(ctx, X(ce.x), Y(ce.v), PB, "rgba(220,38,38,0.8)", 1.5, [4,4]);
    circle(ctx, X(ce.x), Y(ce.v), 8, null, getCss("--bad"), 3);
  }
  ctx.restore();
  marginLabels(fr, showE, showD, showL);
  updateStatus(fail, works, dMax, ce, showE && showD);
}

function updateStatus(fail, works, dMax, ce, ready){
  const F = S.F, first = F.d[0];
  $("bestBtn").disabled = !!(fail && fail.d <= first);
  if (!ready){ $("status").innerHTML = `<div class="small">Turn on the ε-band and the δ-window to check this δ.</div>`; return; }
  let h = "";
  if (works){
    h += `<div class="big ok">✓ This δ works</div>
          <div class="small">Every sampled x with 0 &lt; |x − a| &lt; δ satisfies |f(x) − L| &lt; ε.</div>`;
  } else {
    h += `<div class="big no">✗ This δ does not work</div>
          <div class="small">Counterexample: x = ${fmt(ce.x)}, |f(x) − L| = ${fmt(Math.abs(ce.v-S.L))} ≥ ε</div>`;
  }
  if (fail && fail.d <= first)
    h += `<div class="small" style="margin-top:8px">Largest working δ: none found (checked down to 10<sup>−8</sup>)</div>`;
  else if (!fail)
    h += `<div class="small" style="margin-top:8px">Largest working δ: at least ${fmt(dMax)} (whole slider range)</div>`;
  else
    h += `<div class="small" style="margin-top:8px">Largest working δ ≈ ${fmt(dMax)}</div>`;
  $("status").innerHTML = h;
  $("bestBtn").disabled = !!(fail && fail.d <= first);
}

/* ---------- Controls ---------- */
function setRange(id, min, max, step, val){ const r=$(id); r.min=min; r.max=max; r.step=step; r.value=val; }
function syncControls(){
  const F = S.F;
  setRange("Lrng", F.win.y0, F.win.y1, 0.01, S.L);  $("Lnum").value = fmtIn(S.L);
  setRange("epsRng", 0.005, F.eps[1], 0.005, S.eps); $("epsNum").value = fmtIn(S.eps);
  setRange("delRng", 0.001, F.del[1], 0.001, S.del); $("delNum").value = fmtIn(S.del);
}
function resetParams(){
  const F = S.F;
  S.L = F.L !== null ? F.L : F.Ldef; S.eps = F.eps[0]; S.del = F.del[0];
  syncControls(); draw();
}
function selectFunc(i){
  S.F = FUNCS[i];
  if (!S.F.d) S.F.d = sampleDistances(S.F.del[1]);
  resetParams();
}
function bindPair(rngId, numId, key, positive){
  const r = $(rngId), num = $(numId);
  r.addEventListener("input", () => { S[key] = +r.value; num.value = fmtIn(S[key]); draw(); });
  num.addEventListener("input", () => {
    const v = parseFloat(num.value);
    if (isFinite(v) && (!positive || v > 0)){ S[key] = v; r.value = v; draw(); }
  });
  num.addEventListener("change", () => { num.value = fmtIn(S[key]); });
}

FUNCS.forEach((F,i) => { const o=document.createElement("option"); o.value=i; o.textContent=F.label; $("fsel").appendChild(o); });
$("fsel").addEventListener("change", e => selectFunc(+e.target.value));
bindPair("Lrng","Lnum","L",false);
bindPair("epsRng","epsNum","eps",true);
bindPair("delRng","delNum","del",true);
$("resetBtn").addEventListener("click", resetParams);
$("bestBtn").addEventListener("click", () => {
  const fail = firstFail(S.F, S.L, S.eps);
  S.del = fail ? fail.d : S.F.del[1];
  syncControls(); draw();
});
["tL","tGraph","tEps","tDel","tColor","tCE","tMax"].forEach(id => $(id).addEventListener("change", draw));

function resize(){
  const w = cv.parentElement.clientWidth - 20;
  const h = Math.max(380, Math.min(w*0.66, window.innerHeight - 150));
  cv.style.height = h + "px";
  if (S.F) draw();
}
new ResizeObserver(resize).observe(cv.parentElement);
window.addEventListener("resize", resize);
selectFunc(0);
resize();
