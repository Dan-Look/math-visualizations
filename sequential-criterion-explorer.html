<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequential Criterion Explorer</title>
<style>
  :root{--bg:#f6f7fb;--panel:#fff;--ink:#0f172a;--muted:#5b6474;--line:#e3e7ef;
        --eps:#c2410c;--del:#1d4ed8;--good:#15803d;--bad:#dc2626;--acc:#7c3aed}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4}
  header{padding:18px 24px 0}
  h1{margin:0 0 6px;font-size:28px;font-weight:700;letter-spacing:-.01em}
  .def{font-size:18px;color:#334155}
  .wrap{display:flex;gap:20px;padding:16px 24px 24px;align-items:flex-start}
  .viz{flex:1 1 auto;min-width:0;background:var(--panel);border:1px solid var(--line);
       border-radius:14px;padding:10px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  canvas{display:block;width:100%}
  .panel{flex:0 0 340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:14px 18px 18px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 4px}
  .panel h2:first-child{margin-top:2px}
  select{width:100%;font-size:16px;padding:8px;border-radius:8px;border:1px solid #cbd5e1;background:#fff}
  .seqf{font-size:17px;margin:4px 0 2px}
  .ctl{margin:6px 0}
  .ctl .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
  .ctl .name{font-weight:600;display:flex;align-items:center;gap:8px}
  .swc{width:18px;height:18px;margin:0;cursor:pointer}
  label.name{cursor:pointer}
  input[type=number]{width:100px;font-size:16px;padding:5px 8px;border:1px solid #cbd5e1;border-radius:8px;
                     text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--ink)}
  #epsRng{accent-color:var(--eps)} #delRng{accent-color:var(--del)} #nRng{accent-color:var(--acc)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  button{font-size:15px;padding:7px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#f8fafc;
         color:var(--ink);cursor:pointer}
  button:hover{background:#eef2f7} button:disabled{opacity:.45;cursor:default}
  .tog{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:16px;cursor:pointer}
  .tog input{width:18px;height:18px;margin:0}
  .status{margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
  .big{font-weight:700;font-size:17px}
  .ok{color:var(--good)} .no{color:var(--bad)} .wait{color:var(--muted)}
  .small{font-size:15px;color:#334155;margin-top:4px}
  .readout{font-variant-numeric:tabular-nums;font-size:15.5px;margin-top:8px;color:#334155}
  .note{font-size:13px;color:var(--muted);margin-top:10px}
  @media (max-width:980px){.wrap{flex-direction:column}.panel{flex-basis:auto;width:100%}}
</style>
</head>
<body>
<header>
  <h1>Sequential Criterion Explorer</h1>
  <div class="def">lim<sub>x→c</sub> f(x) = L &nbsp;if and only if&nbsp; f(x<sub>n</sub>) → L for every sequence
    x<sub>n</sub> → c with x<sub>n</sub> ≠ c.</div>
</header>

<div class="wrap">
  <div class="viz"><canvas id="cv"></canvas></div>

  <aside class="panel">
    <h2>Function</h2>
    <select id="fsel"></select>
    <h2>Sequence</h2>
    <select id="ssel"></select>
    <div class="seqf" id="seqFormula"></div>

    <h2>Terms</h2>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tTerms" style="accent-color:var(--acc)">Terms shown</label>
        <input type="number" id="nNum" step="1" min="1" max="60"></div>
      <input type="range" id="nRng" min="1" max="60" step="1">
    </div>
    <div class="btns">
      <button id="stepBtn">Step</button>
      <button id="playBtn">Play</button>
      <button id="rewBtn">Reset</button>
    </div>

    <h2>Neighborhoods</h2>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tL" style="accent-color:#0f172a">Proposed limit L</label>
        <input type="number" id="Lnum" step="any"></div>
      <input type="range" id="Lrng">
    </div>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tEps" style="accent-color:var(--eps)">ε</label>
        <input type="number" id="epsNum" step="any" min="0"></div>
      <input type="range" id="epsRng">
    </div>
    <div class="ctl">
      <div class="row"><label class="name"><input type="checkbox" class="swc" id="tDel" style="accent-color:var(--del)">δ</label>
        <input type="number" id="delNum" step="any" min="0"></div>
      <input type="range" id="delRng">
    </div>
    <div class="btns"><button id="bestBtn">Set δ to largest (numerical)</button></div>

    <h2>Show</h2>
    <label class="tog"><input type="checkbox" id="tGraph"> Graph of f</label>
    <label class="tog"><input type="checkbox" id="tImg"> <span>Images f(x<sub>n</sub>)</span></label>
    <label class="tog"><input type="checkbox" id="tArcs"> Hops between terms</label>
    <label class="tog"><input type="checkbox" id="tLabels"> <span>Term labels x<sub>n</sub></span></label>
    <label class="tog"><input type="checkbox" id="tGuide"> Guide line for the newest term</label>

    <div class="status" id="status"></div>
    <div class="note">Checks use finitely many sample points and the first 100,000 terms. They are numerical evidence, not a proof.</div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- Function library (same functions as the Epsilon–Delta Explorer) ----------
   c: the point x approaches. k: scale for the generic sequences so early terms stay in view. */
const FUNCS = [
  {label:"f(x) = x²,  c = 1", f:x=>x*x, c:1, L:1,
   win:{x0:-0.5,x1:2.5,y0:-1,y1:4}, eps:[0.75,2], del:[0.25,1.5], holes:[], pts:[], breaks:[], n:2000, k:1},
  {label:"f(x) = 2x + 1,  c = 1", f:x=>2*x+1, c:1, L:3,
   win:{x0:-1,x1:3,y0:-1,y1:7}, eps:[1,3], del:[0.4,2], holes:[], pts:[], breaks:[], n:2000, k:1},
  {label:"f(x) = √x,  c = 4", f:x=>x>=0?Math.sqrt(x):NaN, c:4, L:2,
   win:{x0:-1,x1:9,y0:-1,y1:4}, eps:[0.5,2], del:[1.5,4], holes:[], pts:[], breaks:[], n:3000, k:2},
  {label:"f(x) = x² for x ≠ 1, f(1) = 3,  c = 1", f:x=>x===1?3:x*x, c:1, L:1,
   win:{x0:-0.5,x1:2.5,y0:-1,y1:4}, eps:[0.75,2], del:[0.25,1.5], holes:[[1,1]], pts:[[1,3]], breaks:[], n:2000, k:1},
  {label:"f(x) = sin(x)/x,  c = 0", f:x=>x===0?NaN:Math.sin(x)/x, c:0, L:1,
   win:{x0:-8,x1:8,y0:-0.5,y1:1.5}, eps:[0.25,1], del:[1,6], holes:[[0,1]], pts:[], breaks:[], n:3000, k:2},
  {label:"f(x) = x·sin(1/x),  c = 0", f:x=>x===0?NaN:x*Math.sin(1/x), c:0, L:0,
   win:{x0:-0.5,x1:0.5,y0:-0.5,y1:0.5}, eps:[0.2,0.5], del:[0.15,0.5], holes:[[0,0]], pts:[], breaks:[], n:40000, k:0.4},
  {label:"f(x) = x/2 (x ≤ 0), x/2 + 1 (x > 0),  c = 0", f:x=>x>0?x/2+1:x/2, c:0, L:null, Ldef:0.5,
   win:{x0:-2,x1:2,y0:-1.5,y1:2.5}, eps:[0.75,2], del:[0.4,2], holes:[[0,1]], pts:[[0,0]], breaks:[0], n:2000, k:1},
  {label:"f(x) = sin(1/x),  c = 0", f:x=>x===0?NaN:Math.sin(1/x), c:0, L:null, Ldef:0,
   win:{x0:-0.5,x1:0.5,y0:-1.5,y1:1.5}, eps:[0.5,1.5], del:[0.1,0.5], holes:[], pts:[], breaks:[], n:60000, k:0.4},
];

/* ---------- Sequences x_n = c ± h_n ---------- */
const kTxt = k => k === 1 ? "" : String(k);
const SEQS = [
  {h:(n,k)=> k*Math.pow(-1,n)/n, sign:+1, scaled:true,
   txt:k=>`${kTxt(k)}(−1)ⁿ/n`, html:k=>`${kTxt(k)}(−1)<sup>n</sup>/n`},
  {h:(n,k)=> k/n, sign:+1, scaled:true, txt:k=>`${k}/n`, html:k=>`${k}/n`},
  {h:(n,k)=> -k/n, sign:-1, scaled:true, txt:k=>`${k}/n`, html:k=>`${k}/n`},
  {h:(n,k)=> k/(n*n), sign:+1, scaled:true, txt:k=>`${k}/n²`, html:k=>`${k}/n<sup>2</sup>`},
  {h:(n,k)=> k*Math.pow(-1,n)/Math.sqrt(n), sign:+1, scaled:true,
   txt:k=>`${kTxt(k)}(−1)ⁿ/√n`, html:k=>`${kTxt(k)}(−1)<sup>n</sup>/√n`},
  {h:n=> 1/(2*Math.PI*n + Math.PI/2), sign:+1, scaled:false, txt:()=>"1/(2πn + π/2)", html:()=>"1/(2πn + π/2)"},
  {h:n=> 1/(Math.PI*n), sign:+1, scaled:false, txt:()=>"1/(πn)", html:()=>"1/(πn)"},
  {h:n=> -1/(2*Math.PI*n + Math.PI/2), sign:-1, scaled:false, txt:()=>"1/(2πn + π/2)", html:()=>"1/(2πn + π/2)"},
];
function seqText(F, s, html){
  const body = (html ? s.html : s.txt)(F.k);
  if (F.c === 0) return (s.sign < 0 ? "−" : "") + body;
  return String(F.c) + (s.sign < 0 ? " − " : " + ") + body;
}

const NCHECK = 100000, NMAX = 60;
const S = {F:null, seq:SEQS[0], L:0, eps:0, del:0, nShown:6, xs:null, fs:null, timer:null};

/* ---------- Numerical helpers ---------- */
function sampleDistances(W){
  const d = [], NU = 6000, NL = 1600;
  for (let i=1;i<=NU;i++) d.push(W*i/NU);
  for (let j=0;j<NL;j++) d.push(W*Math.pow(10, -8 + 8*j/NL));
  d.sort((p,q)=>p-q);
  return d;
}
// Closest sampled x (to c) with |f(x) - L| >= eps, or null.
function firstFail(F, L, eps){
  for (const d of F.d){
    for (const x of [F.c-d, F.c+d]){
      const v = F.f(x);
      if (!isFinite(v)) continue;
      if (Math.abs(v-L) >= eps) return {d, x, v};
    }
  }
  return null;
}
function buildSequence(){
  const F = S.F, s = S.seq, k = s.scaled ? F.k : 1;
  S.xs = new Float64Array(NCHECK+1); S.fs = new Float64Array(NCHECK+1);
  for (let n=1;n<=NCHECK;n++){ const x = F.c + s.h(n,k); S.xs[n] = x; S.fs[n] = F.f(x); }
}
// Smallest N with test(n) true for all N ≤ n ≤ NCHECK; null if it keeps failing near the end.
function findN(test){
  let last = 0;
  for (let n=1;n<=NCHECK;n++) if (!test(n)) last = n;
  return last > NCHECK - 1000 ? null : last + 1;
}

/* ---------- Formatting ---------- */
const minus = s => s.replace(/-/g, "−");
function fmt(v, sig=5){
  if (!isFinite(v)) return "undefined";
  if (v === 0) return "0";
  if (Math.abs(v) < 1e-4) return minus(v.toExponential(2));
  return minus(String(Number(v.toPrecision(sig))));
}
const fmtIn = v => String(Number(v.toPrecision(6)));
const fmtInt = n => n.toLocaleString("en-US");
function niceStep(range, target){
  const raw = range/target, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
  return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p;
}
function fmtTick(v, step){
  const dec = Math.max(0, -Math.floor(Math.log10(step)+1e-9));
  let s = v.toFixed(dec);
  if (Number(s) === 0) s = (0).toFixed(dec);
  return minus(s);
}
const cssCache = {};
function css(v){ return cssCache[v] || (cssCache[v] = getComputedStyle(document.documentElement).getPropertyValue(v).trim()); }
const FONT = "system-ui,-apple-system,Segoe UI,Roboto,sans-serif";

/* ---------- Drawing helpers ---------- */
function dashed(ctx,x0,y0,x1,y1,color,w=1.5,dash=[6,5]){
  ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle=color; ctx.lineWidth=w;
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke(); ctx.restore();
}
function circle(ctx,x,y,r,fill,stroke,lw=2){
  ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI);
  if (fill){ ctx.fillStyle=fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
}
// Draw "x" with subscript n, e.g. sub("x", "12")
function subLabel(ctx, base, sub, x, y, size, color, align="center"){
  ctx.fillStyle = color; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  const fb = `600 ${size}px ${FONT}`, fs = `600 ${Math.round(size*0.72)}px ${FONT}`;
  ctx.font = fb; const wb = ctx.measureText(base).width;
  ctx.font = fs; const ws = ctx.measureText(sub).width;
  let x0 = align === "center" ? x-(wb+ws)/2 : align === "right" ? x-wb-ws : x;
  ctx.font = fb; ctx.fillText(base, x0, y);
  ctx.font = fs; ctx.fillText(sub, x0+wb, y + size*0.25);
  return wb + ws;
}

/* ---------- Main drawing ----------
   One canvas: graph of f on top, number line for x_n underneath, sharing the same x-scale. */
const cv = $("cv");
function draw(){
  const F = S.F, w = F.win;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);

  const PL = 62, PR = W-80, PT = 18, PB = H - 190;          // graph box
  const LY = H - 62;                                         // number-line y
  const X = x => PL + (x-w.x0)/(w.x1-w.x0)*(PR-PL);
  const Y = y => PB - (y-w.y0)/(w.y1-w.y0)*(PB-PT);

  const fail = firstFail(F, S.L, S.eps);
  const works = !fail || fail.d >= S.del;
  const N = findN(n => Math.abs(S.xs[n]-F.c) < S.del);
  const nS = S.nShown;
  const inDel = n => Math.abs(S.xs[n]-F.c) < S.del;
  const inEps = n => Math.abs(S.fs[n]-S.L) < S.eps;
  const inX = x => x >= w.x0 && x <= w.x1;
  const showL = $("tL").checked, showT = $("tTerms").checked, showG = $("tGraph").checked, showI = $("tImg").checked, showE = $("tEps").checked, showD = $("tDel").checked;
  const NEUTRAL = "#334155";

  /* --- graph grid --- */
  const sx = niceStep(w.x1-w.x0, 8), sy = niceStep(w.y1-w.y0, 7);
  ctx.font = `15px ${FONT}`; ctx.fillStyle = "#475569"; ctx.strokeStyle = "#eef1f6"; ctx.lineWidth = 1;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let x = Math.ceil(w.x0/sx-1e-9)*sx; x <= w.x1+1e-9; x += sx){
    ctx.beginPath(); ctx.moveTo(X(x),PT); ctx.lineTo(X(x),PB); ctx.stroke();
    ctx.fillText(fmtTick(x,sx), X(x), PB+7);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let y = Math.ceil(w.y0/sy-1e-9)*sy; y <= w.y1+1e-9; y += sy){
    ctx.beginPath(); ctx.moveTo(PL,Y(y)); ctx.lineTo(PR,Y(y)); ctx.stroke();
    ctx.fillText(fmtTick(y,sy), PL-8, Y(y));
  }
  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.2;
  if (w.y0<0 && w.y1>0){ ctx.beginPath(); ctx.moveTo(PL,Y(0)); ctx.lineTo(PR,Y(0)); ctx.stroke(); }
  if (w.x0<0 && w.x1>0){ ctx.beginPath(); ctx.moveTo(X(0),PT); ctx.lineTo(X(0),PB); ctx.stroke(); }
  ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1; ctx.strokeRect(PL,PT,PR-PL,PB-PT);

  /* --- δ-window as a column through the graph and down to the number line --- */
  const xl = X(F.c-S.del), xr = X(F.c+S.del), xc = X(F.c);
  ctx.fillStyle = showD ? "rgba(29,78,216,0.08)" : "rgba(0,0,0,0)";
  const cl = Math.max(xl,PL), cw = Math.min(xr,PR)-cl, gap = PB+30;   // skip the tick-label row
  ctx.fillRect(cl, PT, cw, PB-PT); ctx.fillRect(cl, gap, cw, LY+10-gap);

  /* --- graph contents (clipped) --- */
  ctx.save(); ctx.beginPath(); ctx.rect(PL,PT,PR-PL,PB-PT); ctx.clip();
  if (showE){
    ctx.fillStyle = "rgba(194,65,12,0.12)";
    ctx.fillRect(PL, Y(S.L+S.eps), PR-PL, Y(S.L-S.eps)-Y(S.L+S.eps));
  }
  if (showE && showD){
    ctx.strokeStyle = works ? "rgba(21,128,61,0.9)" : "rgba(220,38,38,0.9)"; ctx.lineWidth = 2;
    ctx.strokeRect(xl, Y(S.L+S.eps), xr-xl, Y(S.L-S.eps)-Y(S.L+S.eps));
  }
  if (showL || showE) dashed(ctx, PL, Y(S.L), PR, Y(S.L), "rgba(194,65,12,0.75)");

  const path = new Path2D(); let px = null;
  for (let i=0;i<=F.n;i++){
    const x = w.x0 + (w.x1-w.x0)*i/F.n;
    const y = Math.abs(x-F.c) < 1e-12 ? NaN : F.f(x);
    if (!isFinite(y)){ px = null; continue; }
    if (px === null || F.breaks.some(b => px < b && x >= b)) path.moveTo(X(x),Y(y)); else path.lineTo(X(x),Y(y));
    px = x;
  }
  if (showG){
    ctx.lineJoin = "round"; ctx.strokeStyle = "#475569"; ctx.lineWidth = 2; ctx.stroke(path);
    F.holes.forEach(([hx,hy]) => circle(ctx, X(hx), Y(hy), 5.5, "#fff", "#475569", 2));
    F.pts.forEach(([qx,qy]) => circle(ctx, X(qx), Y(qy), 5.5, "#475569", null));
  }

  // f(x_n): rug on the left edge and points on the graph
  for (let n=1;n<=nS && showI;n++){
    const x = S.xs[n], y = S.fs[n];
    if (!isFinite(y)) continue;
    const col = !showE ? NEUTRAL : inEps(n) ? css("--good") : css("--bad"), latest = n === nS;
    ctx.strokeStyle = col; ctx.lineWidth = latest ? 3.5 : 2;
    ctx.beginPath(); ctx.moveTo(PL, Y(y)); ctx.lineTo(PL + (latest?16:10), Y(y)); ctx.stroke();
    if (inX(x)){
      if (latest) circle(ctx, X(x), Y(y), 7.5, col, "#fff", 2.5);
      else circle(ctx, X(x), Y(y), 4.5, col, null);
    }
  }
  ctx.restore();

  // guide line for the newest term: number line → graph → y-axis
  const xn = S.xs[nS], fn = S.fs[nS];
  if ($("tGuide").checked && showI && inX(xn) && isFinite(fn) && fn >= w.y0 && fn <= w.y1){
    dashed(ctx, X(xn), LY-8, X(xn), PB+30, "rgba(15,23,42,0.5)", 1.4, [4,4]);
    dashed(ctx, X(xn), PB, X(xn), Y(fn), "rgba(15,23,42,0.5)", 1.4, [4,4]);
    dashed(ctx, X(xn), Y(fn), PL, Y(fn), "rgba(15,23,42,0.5)", 1.4, [4,4]);
  }

  // ε labels in the right margin
  ctx.font = `600 16px ${FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = css("--eps");
  const yL = Y(S.L), yt = Y(S.L+S.eps), yb = Y(S.L-S.eps), inY = p => p>=PT-4 && p<=PB+4;
  if (!showE){ if (showL && inY(yL)) ctx.fillText("L", PR+10, yL); }
  else if (yb - yL >= 22){
    if (inY(yt)) ctx.fillText("L + ε", PR+10, yt);
    if (inY(yL)) ctx.fillText("L", PR+10, yL);
    if (inY(yb)) ctx.fillText("L − ε", PR+10, yb);
  } else if (inY(yL)) ctx.fillText("L ± ε", PR+10, yL);

  /* --- number line for the sequence --- */
  ctx.fillStyle = "#334155"; ctx.font = `600 15px ${FONT}`; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("The sequence on the x-axis", PL, PB+52);

  ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PL, LY); ctx.lineTo(PR, LY); ctx.stroke();
  for (let x = Math.ceil(w.x0/sx-1e-9)*sx; x <= w.x1+1e-9; x += sx){
    ctx.beginPath(); ctx.moveTo(X(x), LY-4); ctx.lineTo(X(x), LY+4); ctx.stroke();
  }
  // the δ-neighborhood (c − δ, c + δ) as a thick segment with open endpoints
  const sl = Math.max(xl, PL), sr = Math.min(xr, PR);
  if (showD){
    ctx.strokeStyle = css("--del"); ctx.lineWidth = 6; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.moveTo(sl, LY); ctx.lineTo(sr, LY); ctx.stroke();
    if (xl >= PL) circle(ctx, xl, LY, 5, "#fff", css("--del"), 2.5);
    if (xr <= PR) circle(ctx, xr, LY, 5, "#fff", css("--del"), 2.5);
  }
  // c itself (excluded: x_n ≠ c)
  ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xc, LY-9); ctx.lineTo(xc, LY+9); ctx.stroke();
  if (showD){
    dashed(ctx, xc, PT, xc, PB, "rgba(29,78,216,0.6)");
    dashed(ctx, xc, PB+30, xc, LY-10, "rgba(29,78,216,0.6)");
  }

  // labels c − δ, c, c + δ below the line
  ctx.font = `600 16px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.fillStyle = css("--del");
  const ly = LY + 30;
  if (!showD){ ctx.fillStyle = "#0f172a"; ctx.fillText("c", xc, ly); }
  else if (xc - xl >= 46){
    if (xl >= PL-4) ctx.fillText("c − δ", xl, ly);
    ctx.fillStyle = "#0f172a"; ctx.fillText("c", xc, ly); ctx.fillStyle = css("--del");
    if (xr <= PR+4) ctx.fillText("c + δ", xr, ly);
  } else { ctx.fillStyle = "#0f172a"; ctx.fillText("c", xc, ly); ctx.fillStyle = css("--del"); ctx.fillText("δ-neighborhood", xc, ly+20); }

  // hops between consecutive terms (arcs above the line)
  if ($("tArcs").checked){
    for (let n=2;n<=nS;n++){
      const a = S.xs[n-1], b = S.xs[n];
      if (!inX(a) || !inX(b)) continue;
      const pa = X(a), pb = X(b), hgt = Math.min(70, Math.abs(pb-pa)*0.45) + 6;
      ctx.strokeStyle = n === nS ? "rgba(124,58,237,0.85)" : "rgba(100,116,139,0.35)";
      ctx.lineWidth = n === nS ? 2.2 : 1.3;
      ctx.beginPath(); ctx.moveTo(pa, LY-6); ctx.quadraticCurveTo((pa+pb)/2, LY-6-2*hgt, pb, LY-6); ctx.stroke();
    }
  }
  // the terms
  for (let n=1;n<=nS && showT;n++){
    const x = S.xs[n]; if (!inX(x)) continue;
    const col = !showD ? NEUTRAL : inDel(n) ? css("--del") : "#94a3b8";
    if (n === nS) circle(ctx, X(x), LY, 8, col, "#fff", 2.5);
    else circle(ctx, X(x), LY, 5, col, "#fff", 1.5);
  }
  // ring on x_N once it has appeared
  if (showT && showD && N !== null && N <= nS && inX(S.xs[N])) circle(ctx, X(S.xs[N]), LY, 12, null, css("--acc"), 2.5);

  // term labels x_n above the line, skipping any that would collide
  if ($("tLabels").checked){
    const placed = [];
    const want = [nS]; for (let n=1;n<nS;n++) want.push(n);
    if (showD && N !== null && N <= nS) want.splice(1, 0, N);
    for (const n of want){
      const x = S.xs[n]; if (!inX(x)) continue;
      const p = X(x);
      if (placed.some(q => Math.abs(q-p) < 34)) continue;
      placed.push(p);
      const col = (showD && n === N) ? css("--acc") : n === nS ? "#0f172a" : "#64748b";
      subLabel(ctx, "x", String(n), p, LY-18, 16, col);
    }
  }

  updateStatus(N, works, fail, showD, showE);
}

function updateStatus(N, works, fail, showD, showE){
  const nS = S.nShown, F = S.F;
  const xn = S.xs[nS], inside = Math.abs(xn-F.c) < S.del;
  let h = "";
  if (!showD)
    h += `<div class="small">Turn on the δ-neighborhood to look for N.</div>`;
  else if (N === null)
    h += `<div class="big no">No N found</div><div class="small">The terms keep leaving (c − δ, c + δ) through n = 100,000.</div>`;
  else if (nS < N)
    h += `<div class="big wait">Not there yet</div>
          <div class="small">From x<sub>${fmtInt(N)}</sub> on, every term lies in (c − δ, c + δ). Keep stepping.</div>`;
  else
    h += `<div class="big" style="color:var(--acc)">In the δ-neighborhood: N = ${fmtInt(N)}</div>
          <div class="small">Every term from x<sub>${fmtInt(N)}</sub> on lies in (c − δ, c + δ).</div>`;
  if (!(showD && showE)) {}
  else if (works)
    h += `<div class="small ok" style="margin-top:8px"><b>✓ δ works for this ε</b>, so f(x<sub>n</sub>) lies in (L − ε, L + ε) for every n ≥ N.</div>`;
  else
    h += `<div class="small no" style="margin-top:8px"><b>✗ δ does not work for this ε</b>, so landing in (c − δ, c + δ) does not force f(x<sub>n</sub>) into (L − ε, L + ε).</div>`;
  h += `<div class="readout">x<sub>${nS}</sub> = ${fmt(xn)}${showD ? ` (${inside ? "inside" : "outside"} the δ-neighborhood)` : ""}`
     + (showI() ? `<br>f(x<sub>${nS}</sub>) = ${fmt(S.fs[nS])}` : "") + `</div>`;
  $("status").innerHTML = h;
  $("bestBtn").disabled = !!(fail && fail.d <= F.d[0]);
}

const showI = () => $("tImg").checked;

/* ---------- Controls ---------- */
function setRange(id, min, max, step, val){ const r=$(id); r.min=min; r.max=max; r.step=step; r.value=val; }
function syncControls(){
  const F = S.F;
  setRange("Lrng", F.win.y0, F.win.y1, 0.01, S.L);  $("Lnum").value = fmtIn(S.L);
  setRange("epsRng", 0.005, F.eps[1], 0.005, S.eps); $("epsNum").value = fmtIn(S.eps);
  setRange("delRng", 0.001, F.del[1], 0.001, S.del); $("delNum").value = fmtIn(S.del);
  $("nRng").value = S.nShown; $("nNum").value = S.nShown;
}
function fillSeqMenu(){
  const F = S.F, sel = $("ssel"), idx = SEQS.indexOf(S.seq);
  sel.innerHTML = "";
  SEQS.forEach((s,i) => { const o=document.createElement("option"); o.value=i; o.textContent=seqText(F,s,false); sel.appendChild(o); });
  sel.value = idx;
  $("seqFormula").innerHTML = "x<sub>n</sub> = " + seqText(F, S.seq, true);
}
function selectFunc(i){
  const F = S.F = FUNCS[i];
  if (!F.d) F.d = sampleDistances(F.del[1]);
  S.L = F.L !== null ? F.L : F.Ldef; S.eps = F.eps[0]; S.del = F.del[0];
  fillSeqMenu(); buildSequence(); syncControls(); draw();
}
function selectSeq(i){
  S.seq = SEQS[i];
  $("seqFormula").innerHTML = "x<sub>n</sub> = " + seqText(S.F, S.seq, true);
  buildSequence(); draw();
}
function bindPair(rngId, numId, key, positive){
  const r = $(rngId), num = $(numId);
  r.addEventListener("input", () => { S[key] = +r.value; num.value = fmtIn(S[key]); draw(); });
  num.addEventListener("input", () => {
    const v = parseFloat(num.value);
    if (isFinite(v) && (!positive || v > 0)){ S[key] = v; r.value = v; draw(); }
  });
  num.addEventListener("change", () => { num.value = fmtIn(S[key]); });
}
function setN(n){
  S.nShown = Math.max(1, Math.min(NMAX, Math.round(n)));
  $("nRng").value = S.nShown; $("nNum").value = S.nShown; draw();
}
function stopPlay(){ if (S.timer){ clearInterval(S.timer); S.timer = null; } $("playBtn").textContent = "Play"; }

FUNCS.forEach((F,i) => { const o=document.createElement("option"); o.value=i; o.textContent=F.label; $("fsel").appendChild(o); });
$("fsel").addEventListener("change", e => selectFunc(+e.target.value));
$("ssel").addEventListener("change", e => selectSeq(+e.target.value));
bindPair("Lrng","Lnum","L",false);
bindPair("epsRng","epsNum","eps",true);
bindPair("delRng","delNum","del",true);
$("nRng").addEventListener("input", e => { stopPlay(); setN(+e.target.value); });
$("nNum").addEventListener("input", e => { const v = parseInt(e.target.value); if (v>=1 && v<=NMAX){ stopPlay(); setN(v); } });
$("nNum").addEventListener("change", e => { e.target.value = S.nShown; });
$("stepBtn").addEventListener("click", () => { stopPlay(); setN(S.nShown + 1); });
$("rewBtn").addEventListener("click", () => { stopPlay(); setN(1); });
$("playBtn").addEventListener("click", () => {
  if (S.timer){ stopPlay(); return; }
  if (S.nShown >= NMAX) setN(1);
  $("playBtn").textContent = "Pause";
  S.timer = setInterval(() => { if (S.nShown >= NMAX) stopPlay(); else setN(S.nShown + 1); }, 600);
});
$("bestBtn").addEventListener("click", () => {
  const fail = firstFail(S.F, S.L, S.eps);
  S.del = fail ? fail.d : S.F.del[1];
  syncControls(); draw();
});
["tL","tTerms","tGraph","tImg","tEps","tDel","tArcs","tLabels","tGuide"].forEach(id => $(id).addEventListener("change", draw));

function resize(){
  const w = cv.parentElement.clientWidth - 20;
  const h = Math.max(560, Math.min(w*0.78, window.innerHeight - 140));
  cv.style.height = h + "px";
  if (S.F) draw();
}
new ResizeObserver(resize).observe(cv.parentElement);
window.addEventListener("resize", resize);
selectFunc(0);
resize();
</script>
</body>
