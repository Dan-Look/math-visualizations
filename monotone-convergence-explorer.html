<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monotone Convergence Explorer</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#203047;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:15px}h1{font-size:23px;margin:0 0 12px}.layout{display:grid;grid-template-columns:265px minmax(0,1fr);gap:15px}.card{background:white;border:1px solid #dce4ec;border-radius:10px;padding:15px}.field{margin-bottom:13px}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}select,input[type=number]{width:100%;padding:7px;border:1px solid #bbc9d6;border-radius:6px;background:white;font-size:14px}input[type=range]{width:100%;accent-color:#2c6cad}.row{display:flex;gap:7px;align-items:center}.row input[type=range]{flex:1;min-width:0}.row input[type=number]{width:65px}.row button{padding:6px 10px}.buttons{display:flex;flex-wrap:wrap;gap:6px}button{background:#e9f0fa;border:1px solid #b9cde3;border-radius:6px;padding:7px 10px;cursor:pointer;color:#183a65;font-weight:600}button:hover{background:#dbe9fa}button.primary{background:#2464a7;color:white;border-color:#2464a7}button:disabled{opacity:.4;cursor:default}.check{display:flex;align-items:center;gap:7px;font-size:13px;margin:9px 0}.check input{margin:0}.subtle{font-size:12px;color:#607085}.answer{font-size:13px;line-height:1.5;background:#f0f6ff;border:1px solid #d8e6f7;padding:10px;border-radius:7px;margin-top:10px}.answer[hidden]{display:none}.graphTop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}.graphTop strong{font-size:16px}.graphTop span{font-size:12px;color:#5b6a7b}canvas{display:block;width:100%;height:min(65vh,520px);min-height:300px;border:1px solid #dce4ec;border-radius:7px}.graphBottom{font-size:12px;color:#5b6a7b;margin-top:8px}.speed{margin-top:5px}.yrow{display:flex;gap:8px}.yrow label{flex:1}.yrow input{margin-top:4px}.key{font-size:12px;color:#4b6075}.key b{color:#db423f}@media(max-width:780px){.layout{grid-template-columns:1fr}canvas{height:380px}body{padding:10px}}
</style></head><body><a href="index.html" style="display:inline-block;align-self:flex-start;margin:0 0 6px;font:600 13px Arial,Helvetica,sans-serif;color:#2762ad;text-decoration:none">← All visualizations</a><h1>Monotone Convergence Explorer</h1><div class="layout"><section class="card">
<div class="field"><label for="example">Mystery sequence</label><select id="example"><option value="0">Example A</option><option value="1">Example B</option><option value="2">Example C</option><option value="3">Example D</option><option value="4">Example E</option></select></div>
<div class="field"><label>Reveal terms: <span id="countLabel">0</span> of 60</label><div class="row"><button id="minus" title="Previous term">−</button><input type="range" id="count" min="0" max="60" step="1" value="0"><button id="plus" title="Next term">+</button></div></div>
<div class="field"><div class="buttons"><button class="primary" id="play">▶ Reveal</button><button id="pause">Pause</button><button id="all">Show all</button><button id="clear">Clear</button></div></div>
<div class="field"><label for="speed">Reveal speed <span id="speedLabel" class="subtle"></span></label><input id="speed" type="range" min="1" max="10" value="5" step="1"><div class="row subtle" style="justify-content:space-between"><span>Slower</span><span>Faster</span></div></div>
<div class="field"><label class="check"><input type="checkbox" id="connect"> Connect consecutive terms</label><label class="check"><input type="checkbox" id="bound"> Show a bound / limit line</label><label class="check"><input type="checkbox" id="epsilonBand"> Show an ε-band</label><label class="check"><input type="checkbox" id="answerToggle"> Reveal formula and classification</label></div>
<div class="field"><label>Vertical range</label><div class="yrow"><label class="subtle">Y-min<input id="ymin" type="number" step="any"></label><label class="subtle">Y-max<input id="ymax" type="number" step="any"></label></div><button id="autoRange" style="margin-top:8px">Auto range</button></div>
<div id="answer" class="answer" hidden></div>
</section><section class="card"><div class="graphTop"><strong>What can we conclude?</strong><span class="key">Previous terms: blue · <b>Newest term: red</b></span></div><canvas id="graph"></canvas><div class="graphBottom">Reveal the terms, then ask: Is the sequence increasing or decreasing? Is it bounded above or below? Does the Monotone Convergence Theorem apply?</div></section></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('graph'),ctx=canvas.getContext('2d');
const examples=[
{f:n=>3-4/(n+1),formula:'aₙ = 3 − 4/(n + 1)',type:'Strictly increasing',bounds:'Bounded above by 3 (and below)',conclusion:'Converges to 3 by the Monotone Convergence Theorem.',line:3,range:[-0.5,3.5]},
{f:n=>1+5/n,formula:'aₙ = 1 + 5/n',type:'Strictly decreasing',bounds:'Bounded below by 1 (and above)',conclusion:'Converges to 1 by the Monotone Convergence Theorem.',line:1,range:[0,7]},
{f:n=>2+Math.pow(-1,n)/n,formula:'aₙ = 2 + (−1)ⁿ/n',type:'Not monotone',bounds:'Bounded above and below',conclusion:'Converges to 2, but the Monotone Convergence Theorem does not apply directly.',line:2,range:[0.5,3]},
{f:n=>n<=7?[2.5,1.5,2.6,1.8,2.3,1.9,2.7][n-1]:3-1/n,formula:'a₁,…,a₇ = 2.5, 1.5, 2.6, 1.8, 2.3, 1.9, 2.7; aₙ = 3 − 1/n for n ≥ 8',type:'Not monotone initially; strictly increasing for n ≥ 8',bounds:'Bounded above by 3 (and below)',conclusion:'The tail (n ≥ 8) is increasing and bounded above, so it converges to 3. Changing finitely many terms does not change the limit.',line:3,range:[1,3.5]},
{f:n=>2,formula:'aₙ = 2',type:'Constant (both nondecreasing and nonincreasing)',bounds:'Bounded above and below',conclusion:'Converges to 2. Monotone does not have to mean strictly increasing or decreasing.',line:2,range:[1,3]}
];
let current=0,timer=null,active=false;
function selected(){return examples[Number($('example').value)]}
function setCount(v){current=Math.max(0,Math.min(60,Math.round(v)));$('count').value=current;$('countLabel').textContent=current;draw()}
function stop(){clearTimeout(timer);timer=null;active=false}
function delay(){return Math.round(1550*Math.pow(0.70,Number($('speed').value)-1))}
function updateSpeed(){$('speedLabel').textContent='('+ (delay()/1000).toFixed(2)+' s/term)'}
function tick(){if(!active)return;if(current>=60){stop();return}setCount(current+1);timer=setTimeout(tick,delay())}
function play(){stop();if(current>=60)setCount(0);active=true;tick()}
function refreshAnswer(){const e=selected();$('answer').hidden=!$('answerToggle').checked;$('answer').innerHTML='<strong>'+e.formula+'</strong><br><b>Monotonicity:</b> '+e.type+'<br><b>Bounds:</b> '+e.bounds+'<br><b>Conclusion:</b> '+e.conclusion;draw()}
function loadExample(){stop();setCount(0);const [a,b]=selected().range;$('ymin').value=a;$('ymax').value=b;$('answerToggle').checked=false;$('bound').checked=false;$('epsilonBand').checked=false;refreshAnswer()}
function draw(){const rect=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(rect.width,1),h=Math.max(rect.height,1);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const ymin=Number($('ymin').value),ymax=Number($('ymax').value);if(!(ymax>ymin)){ctx.fillText('Y-max must exceed Y-min.',20,25);return}const p={l:53,r:16,t:23,b:37},gw=w-p.l-p.r,gh=h-p.t-p.b;const x=n=>p.l+(n-1)/59*gw,y=v=>p.t+(ymax-v)/(ymax-ymin)*gh,e=selected();ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.rect(p.l,p.t,gw,gh);ctx.clip();for(let k=0;k<=5;k++){const v=ymin+(ymax-ymin)*k/5;ctx.strokeStyle='#e9edf2';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.l,y(v));ctx.lineTo(p.l+gw,y(v));ctx.stroke()}if($('epsilonBand').checked&&e.line!==null){const epsilon=(ymax-ymin)*0.045, top=y(e.line+epsilon),bottom=y(e.line-epsilon);ctx.fillStyle='rgba(39,160,99,.16)';ctx.fillRect(p.l,top,gw,bottom-top);ctx.strokeStyle='#31976a';ctx.lineWidth=1.2;ctx.setLineDash([4,4]);for(const edge of [e.line-epsilon,e.line+epsilon]){ctx.beginPath();ctx.moveTo(p.l,y(edge));ctx.lineTo(p.l+gw,y(edge));ctx.stroke()}ctx.setLineDash([]);ctx.fillStyle='#197b55';ctx.font='bold 12px Arial';ctx.fillText('ε-band',p.l+8,Math.max(p.t+12,top-6))}if($('bound').checked&&e.line!==null){ctx.strokeStyle='#238b60';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(p.l,y(e.line));ctx.lineTo(p.l+gw,y(e.line));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#167a52';ctx.font='bold 12px Arial';ctx.fillText($('answerToggle').checked?'L = '+e.line:'Reference line',p.l+8,y(e.line)-9)}if($('connect').checked&&current>1){ctx.strokeStyle='rgba(47,101,171,.48)';ctx.lineWidth=1.5;ctx.beginPath();for(let n=1;n<=current;n++){const v=e.f(n);if(n===1)ctx.moveTo(x(n),y(v));else ctx.lineTo(x(n),y(v))}ctx.stroke()}for(let n=1;n<=current;n++){const v=e.f(n);ctx.fillStyle=n===current?'#db423f':'#2d6cad';ctx.beginPath();ctx.arc(x(n),y(v),n===current?5.6:3.6,0,2*Math.PI);ctx.fill()}ctx.restore();ctx.strokeStyle='#a3afbc';ctx.lineWidth=1;ctx.strokeRect(p.l,p.t,gw,gh);ctx.fillStyle='#546477';ctx.font='12px Arial';ctx.textAlign='right';ctx.textBaseline='middle';for(let k=0;k<=5;k++){const v=ymin+(ymax-ymin)*k/5;ctx.fillText(Number(v.toPrecision(4)).toString(),p.l-8,y(v))}ctx.textAlign='center';ctx.textBaseline='top';for(const n of [1,10,20,30,40,50,60])ctx.fillText(n,x(n),p.t+gh+7);ctx.fillText('n',p.l+gw/2,h-15)}
$('example').addEventListener('change',loadExample);$('count').addEventListener('input',()=>{stop();setCount(Number($('count').value))});$('minus').addEventListener('click',()=>{stop();setCount(current-1)});$('plus').addEventListener('click',()=>{stop();setCount(current+1)});$('play').addEventListener('click',play);$('pause').addEventListener('click',()=>{if(active){stop();$('pause').textContent='Resume'}else if(current<60){active=true;$('pause').textContent='Pause';timer=setTimeout(tick,delay())}});$('all').addEventListener('click',()=>{stop();setCount(60)});$('clear').addEventListener('click',()=>{stop();setCount(0)});$('speed').addEventListener('input',updateSpeed);$('connect').addEventListener('change',draw);$('bound').addEventListener('change',draw);$('epsilonBand').addEventListener('change',draw);$('answerToggle').addEventListener('change',refreshAnswer);$('ymin').addEventListener('input',draw);$('ymax').addEventListener('input',draw);$('autoRange').addEventListener('click',()=>{const [a,b]=selected().range;$('ymin').value=a;$('ymax').value=b;draw()});window.addEventListener('resize',draw);updateSpeed();loadExample();
</script></body></html>
